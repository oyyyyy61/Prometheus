#


global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "host.docker.internal:9093"

scrape_configs:
  - job_name: "training"
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: "recovery-controller"
    static_configs:
      - targets: ["host.docker.internal:9001"]

  #9100 提供 CPU、内存、网络等主机指标
  - job_name: "lab-501-node"
    static_configs:
      - targets: ["10.1.125.178:9100"]
        labels:
          host: "lab-501"
          component: "node"
          machine: "RTX-4090"
  #监控 4090 本身还需抓取 9400
  - job_name: lab-501-dcgm
    scrape_interval: 5s
    static_configs:
      - targets: ["10.1.125.178:9400"]
        labels:
          host: "lab-501"
          component: "gpu"
          machine: "RTX-4090"
  # 4090 上的实际训练进程；需要由训练程序暴露 /metrics。
  - job_name: lab-501-training
    scrape_interval: 5s
    static_configs:
      - targets: ["10.1.125.178:8000"]
        labels:
          host: "lab-501"
          component: "training"
          machine: "RTX-4090"
  #昇腾910B2
  - job_name: "rental-node"
    scrape_interval: 5s
    static_configs:
    - targets: ["host.docker.internal:19100"]
      labels:
        host: "rental-910b2"
        component: "node"
        machine: "Ascend-910B2"
    - targets: ["host.docker.internal:18082"]
      labels:
        host: "rental-910b2"
        component: "npu"
        machine: "Ascend-910B2"
        accelerator_vendor: "Huawei"
        accelerator_model: "Ascend-910B2"
    - targets: ["host.docker.internal:18010"]
      labels:
        host: "rental-910b2"
        component: "agent-runtime"
        machine: "Ascend-910B2"
        runtime: "vllm-agent-bridge"
    - targets: ["host.docker.internal:19004"]
      labels:
        host: "rental-910b2"
        component: "recovery-agent"
        machine: "Ascend-910B2"
        runtime: "remote-recovery-agent"
