apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-accelerator-federation
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  accelerator-federation.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "在线 exporter",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(accelerator:exporter_up{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"})", "legendFormat": "exporters"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "justifyMode": "center"}
        },
        {
          "type": "stat",
          "title": "加速卡数量",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(accelerator:device_count{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"})", "legendFormat": "devices"}],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "justifyMode": "center"}
        },
        {
          "type": "stat",
          "title": "平均计算利用率",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "avg(accelerator:utilization_percent{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"})", "legendFormat": "average"}],
          "fieldConfig": {"defaults": {"unit": "percent", "decimals": 1, "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 95}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "background", "justifyMode": "center"}
        },
        {
          "type": "stat",
          "title": "总功耗",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(accelerator:power_watts{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"})", "legendFormat": "power"}],
          "fieldConfig": {"defaults": {"unit": "watt", "decimals": 1, "min": 0}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "justifyMode": "center"}
        },
        {
          "type": "timeseries",
          "title": "计算利用率",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "accelerator:utilization_percent{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"}", "legendFormat": "{{host}} / {{accelerator_model}} / {{accelerator_id}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "显存 / HBM 使用率",
          "description": "NVIDIA GB10 的当前 DCGM exporter 未提供 FB_USED/FB_FREE，因此该设备在此面板显示无数据。",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "accelerator:memory_utilization_percent{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"}", "legendFormat": "{{host}} / {{accelerator_model}} / {{accelerator_id}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "温度",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "accelerator:temperature_celsius{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"}", "legendFormat": "{{host}} / {{accelerator_model}} / {{accelerator_id}}"}],
          "fieldConfig": {"defaults": {"unit": "celsius", "min": 0, "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "功耗",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "accelerator:power_watts{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"}", "legendFormat": "{{host}} / {{accelerator_model}} / {{accelerator_id}}"}],
          "fieldConfig": {"defaults": {"unit": "watt", "min": 0, "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "type": "timeseries",
          "title": "已用与总显存 / HBM",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 20},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "accelerator:memory_used_bytes{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"}", "legendFormat": "used / {{host}} / {{accelerator_model}} / {{accelerator_id}}"},
            {"refId": "B", "expr": "accelerator:memory_total_bytes{accelerator_vendor!~\"^$\",accelerator_vendor=~\"$vendor\",host=~\"$host\"}", "legendFormat": "total / {{host}} / {{accelerator_model}} / {{accelerator_id}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}}
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["accelerator", "federation", "nvidia", "ascend"],
      "templating": {"list": [
        {
          "name": "vendor",
          "label": "厂商",
          "type": "query",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "query": "label_values(accelerator:utilization_percent, accelerator_vendor)",
          "refresh": 1,
          "includeAll": true,
          "multi": true,
          "allValue": ".*",
          "current": {"text": "All", "value": ["$__all"]}
        },
        {
          "name": "host",
          "label": "主机",
          "type": "query",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "query": "label_values(accelerator:utilization_percent{accelerator_vendor=~\"$vendor\"}, host)",
          "refresh": 1,
          "includeAll": true,
          "multi": true,
          "allValue": ".*",
          "current": {"text": "All", "value": ["$__all"]}
        }
      ]},
      "time": {"from": "now-30m", "to": "now"},
      "title": "异构加速卡联邦总览",
      "uid": "accelerator-federation",
      "version": 1
    }
