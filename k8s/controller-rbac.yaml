apiVersion: v1
kind: ServiceAccount
metadata:
  name: training-recovery-controller
  namespace: training-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: training-recovery-controller
  namespace: training-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: training-recovery-controller
  namespace: training-demo
subjects:
  - kind: ServiceAccount
    name: training-recovery-controller
    namespace: training-demo
roleRef:
  kind: Role
  name: training-recovery-controller
  apiGroup: rbac.authorization.k8s.io
