#

apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: lab-501
  namespace: monitoring
  labels:
    release: monitoring
spec:
  scrapeInterval: 5s
  scrapeTimeout: 4s
  staticConfigs:
    - targets:
        - "10.1.125.178:9100"
      labels:
        host: "lab-501"
        component: "node"
        machine: "RTX-4090"
    - targets:
        - "10.1.125.178:9400"
      labels:
        host: "lab-501"
        component: "gpu"
        machine: "RTX-4090"
        accelerator_vendor: "NVIDIA"
        accelerator_model: "GeForce-RTX-4090"
    # 训练进程需要在 4090 主机上监听 0.0.0.0:8000 并暴露 /metrics。
    - targets:
        - "10.1.125.178:8000"
      labels:
        host: "lab-501"
        component: "training"
        machine: "RTX-4090"
    - targets:
        - "10.252.28.0:9100"
      labels:
        host: "qujing"
        component: "node"
    - targets:
        - "10.252.28.0:9400"
      labels:
        host: "qujing"
        component: "gpu"
        machine: "NVIDIA-GB10"
        accelerator_vendor: "NVIDIA"
        accelerator_model: "GB10"
